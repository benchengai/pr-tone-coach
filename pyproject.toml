[project]
name = "pr-tone-coach"
version = "0.1.0"
description = "Pre-send checker for code review comments: who the criticism targets, pushback risk with the phrases behind it, and a rewrite that keeps every technical point."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2",
    "pydantic>=2.7",
]

[project.scripts]
prtone = "prtone.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prtone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
